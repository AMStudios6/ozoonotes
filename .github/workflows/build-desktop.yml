name: Build OzooNotes for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'desktop-v*'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Windows installer and portable app
        run: npm run desktop:dist
      - name: Upload executable files
        uses: actions/upload-artifact@v4
        with:
          name: OzooNotes-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

